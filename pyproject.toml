[project]
name = "polymath-1m"
version = "0.1.0"
description = "Reproducible Polymarket strategy research and execution"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5,<1.6",
    "matplotlib>=3.10,<4",
    "numpy>=2.4.4",
    "pyarrow>=25,<26",
    "torch>=2.13.0",
    "websockets>=15,<17",
]

[project.scripts]
polymath_1M = "polymath_1M.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymath_1M"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff.lint]
ignore = ["N999"]
